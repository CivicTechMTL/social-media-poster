<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter";
    src: url("{{ assets.font }}") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Inter";
    src: url("{{ assets.font_italic }}") format("woff2");
    font-weight: 100 900;
    font-style: italic;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }
  body {
    font-family: "Inter", sans-serif;
    font-feature-settings: "cv11", "ss03";  /* single-storey a off, rounded quotes */
    color: #fff;
    background: url("{{ assets.background }}") center / cover;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .shadow {
    text-shadow: 0 1px 2px rgba(0,0,0,.12), 0 2px 18px rgba(0,0,0,.18);
  }

  /* ---------- Heading ---------- */
  .heading {
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.02;
    white-space: nowrap;
  }
  .heading > span {
    display: inline-block;
  }
  {# .heading .num { font-weight: 800; } #}

  /* ---------- Speaker Photos ---------- */
  .photos {
    display: flex;
    justify-content: flex-end;
  }
  .photo {
    border-radius: 50%;
    overflow: hidden;
    flex: none;
    border: 5px solid rgba(255,255,255,.92);
    box-shadow: 0 10px 40px rgba(0,0,0,.18);
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo .initials {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.16);
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .photos.two .photo + .photo {
    margin-left: -40px;
  }

  /* ---------- date block (FR and EN styled identically) ---------- */
  .when .line {
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: 1.2;
    white-space: nowrap;
  }
  .when .dot {
    font-weight: 400;
    opacity: .8;
    padding: 0 0.12em;
  }
  .when .pill {
    display: inline-block;
    margin-top: 22px;
    padding: 14px 30px;
    border-radius: 999px;
    background: #FBF7EC;
    color: #222;
    text-shadow: none;
    font-size: 21px;
    font-weight: 750;
    letter-spacing: .06em;
    line-height: 1.3;
    text-transform: uppercase;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    white-space: nowrap;
  }
  .when.side {
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    grid-column: 1 / -1;  /* span the empty photo column too, so it centres on the full width */
    margin-top: 24px;
  }
  .when.side .pill {
    margin-top: 0;
  }
  .when .pill span {
    display: block;
  }
  .when .pill i {
    display: block;
    height: 1.5px;
    margin: 7px 6px;
    background: rgba(0,0,0,.14);
  }

  /* ---------- talk (FR and EN styled identically; alignment differs) ---------- */
  .speaker-name span {
    white-space: nowrap;
  }
  .speaker-name .placeholder {
    font-style: italic;
    font-weight: 400;
  }
  .speaker-name {
    font-weight: 750;
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin-bottom: 6px;
  }
  .title {
    font-weight: 400;
    line-height: 1.16;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .title b {
    font-weight: 700;
  }
  .title b.whole {
    font-weight: 600;  /* lighter than a prefix, since it covers the whole title */
  }
  .title.en {
    text-align: right;
    /* Keep clear of the corner logo (~0.85 × its height wide, plus a gap). */
    margin-left: 130px;
  }
  .logo {
    position: absolute;
    display: block;
  }
</style>
{# Layouts add their own <style> element here. #}
{% block style %}{% endblock %}
</head>
<body style="--s: 1">
{% block body %}{% endblock %}
<script>
  // Shrink the scalable text (--s) until nothing overflows its [data-fit] box.
  window.__fit = () => {
    // Size the parent of [data-fill-width] so that span spans the full width exactly
    // (the rest of the parent, e.g. "Meetup #15", inherits the same size).
    for (const el of document.querySelectorAll("[data-fill-width]")) {
      const box = el.parentElement;
      box.style.fontSize = "100px";
      box.style.fontSize = (100 * box.clientWidth / el.getBoundingClientRect().width) + "px";
    }
    const boxes = [...document.querySelectorAll("[data-fit]")];
    // Start large and step down, so short titles grow to fill and long ones shrink.
    const over = () => boxes.some(b => b.scrollHeight > b.clientHeight + 1);
    let s = 1.4;
    document.body.style.setProperty("--s", s);
    while (over() && s > 0.6) { s -= 0.02; document.body.style.setProperty("--s", s); }
    // Names don't wrap, so shrink any that are wider than their column (e.g. long full names).
    for (const el of document.querySelectorAll(".speaker-name")) {
      const ratio = el.clientWidth / el.scrollWidth;
      if (ratio < 1) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * ratio * 0.99) + "px";
    }
    return s;
  };
  {% if preview %}document.fonts.ready.then(() => window.__fit());{% endif %}
</script>
</body>
</html>
